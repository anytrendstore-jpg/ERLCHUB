<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none">
  <!-- Stack of coins -->
  <ellipse cx="70" cy="140" rx="50" ry="20" fill="#1a1a28" stroke="#8e00f7" stroke-width="3"/>
  <ellipse cx="70" cy="130" rx="50" ry="20" fill="#1a1a28" stroke="#8e00f7" stroke-width="3"/>
  <ellipse cx="70" cy="120" rx="50" ry="20" fill="#1a1a28" stroke="#8e00f7" stroke-width="3"/>
  <ellipse cx="70" cy="110" rx="50" ry="20" fill="#12121c" stroke="#8e00f7" stroke-width="3"/>

  <!-- Front coin -->
  <ellipse cx="140" cy="120" rx="45" ry="45" fill="#12121c" stroke="#8e00f7" stroke-width="4"/>
  <ellipse cx="140" cy="120" rx="35" ry="35" fill="none" stroke="#8e00f7" stroke-width="2"/>

  <!-- HC text on coin -->
  <text x="140" y="115" text-anchor="middle" fill="#8e00f7" font-family="Arial, sans-serif" font-weight="bold" font-size="20">ERLC</text>
  <text x="140" y="135" text-anchor="middle" fill="#a64dfa" font-family="Arial, sans-serif" font-weight="bold" font-size="14">HUB</text>
</svg>
